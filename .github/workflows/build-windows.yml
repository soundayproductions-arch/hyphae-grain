name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: HyphaeGrain-Windows
          path: |
            build/HyphaeGrain_artefacts/Release/VST3/
            build/HyphaeGrain_artefacts/Release/Standalone/
